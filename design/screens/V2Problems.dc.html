<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zgrai.pl your problems</title>
<script src="./support.js"></script>
<script src="/_blob/1b08621c783843424178ab6c6f02b059"></script>
<script src="/_blob/125719f3204e73f78d270569f9224f01"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#404040}
</style>
</helmet>
<div ref="{{refRt}}" style="position: relative; min-height: 900px; background: #FFFFFF; font-family: 'Geist', system-ui, sans-serif; color: #0A0A0A">

  <canvas ref="{{refCv}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3"></canvas>

  <header style="border-bottom: 1px solid #F0F0F0">
    <div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="V2Problems.dc.html" aria-current="page" style="display: inline-flex; align-items: baseline; text-decoration: none; color: #0A0A0A; font-size: 19px; font-weight: 700; letter-spacing: -0.04em">zgr<span style="margin-left: 2px; padding: 0 6px 2px; border-radius: 8px; background: #0A0A0A; color: #FFFFFF; letter-spacing: -0.02em">ai</span><span style="margin-left: 1px; color: #A3A3A3; font-weight: 500">.pl</span></a>
      <button type="button" aria-label="Account: Dawid" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #E5E5E5; background: #F5F5F5; color: #0A0A0A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">D</button>
    </div>
  </header>

  <main style="max-width: 920px; margin: 0 auto; padding: 44px 24px 64px; display: flex; flex-direction: column; gap: 36px">

    <h1 style="margin: 0; font-size: 40px; line-height: 1.05; letter-spacing: -0.04em; font-weight: 600">Your problems</h1>

    <form aria-label="New problem" style="display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 14px; border-radius: 22px; border: 1px solid #E5E5E5; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 16px 40px rgba(0,0,0,0.06)">
      <label for="np-text" style="font-size: 13px; font-weight: 500; color: #6B6B6B">New problem</label>
      <textarea id="np-text" rows="2" placeholder="What does your group need to decide?" style="border: none; outline: none; resize: none; padding: 0; font-family: inherit; font-size: 18px; line-height: 1.5; color: #0A0A0A; background: transparent"></textarea>
      <div style="display: flex; justify-content: flex-end">
        <a href="V2Start.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 14px; background: #0A0A0A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Wake the agents<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </div>
    </form>

    <section aria-label="Problems" style="display: flex; flex-direction: column">
      <sc-for list="{{problems}}" as="p" hint-placeholder-count="4">
        <a href="{{p.href}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; padding: 20px 4px; border-bottom: 1px solid #F0F0F0; text-decoration: none; color: #0A0A0A">
          <span style="display: flex; flex: none; width: 112px">
            <sc-for list="{{p.bots}}" as="b" hint-placeholder-count="5">
              <span data-jelly="auto" data-color="{{b.color}}" data-state="{{b.state}}" aria-hidden="true" style="flex: none; display: block; width: 32px; height: 32px; margin-right: -9px"></span>
            </sc-for>
          </span>
          <span style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.015em">{{p.title}}</span>
            <span style="font-size: 14px; color: {{p.metaColor}}">{{p.meta}}</span>
          </span>
          <span aria-label="{{p.progressLabel}}" style="display: grid; grid-template-columns: repeat(5, 18px); gap: 4px; flex: none">
            <sc-for list="{{p.segs}}" as="s" hint-placeholder-count="5">
              <span style="height: 5px; border-radius: 999px; background: {{s.c}}"></span>
            </sc-for>
          </span>
          <span style="flex: none; min-width: 92px; text-align: right; font-size: 13px; color: #6B6B6B">{{p.role}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </section>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() { this.tryMount(0); }
  componentWillUnmount() {
    clearTimeout(this.retryT);
    if (this.jelly) { this.jelly.dispose(); this.jelly = null; }
  }
  tryMount(n) {
    if (this.jelly) return;
    const J = window.ZgraiJelly;
    if (!J || !this.cv || !this.rt) {
      if (n < 60) this.retryT = setTimeout(() => this.tryMount(n + 1), 100);
      return;
    }
    this.jelly = J.mountOverlay(this.cv, this.rt, {});
  }
  renderVals() {
    if (!this.refCv) {
      this.refCv = (el) => { this.cv = el; };
      this.refRt = (el) => { this.rt = el; };
    }
    return Object.assign(this.baseVals(), { refCv: this.refCv, refRt: this.refRt });
  }
  baseVals() {
    const on = (fill) => ({ fill, color: fill, state: 'awake', open: 1, closed: 0 });
    const off = () => ({ fill: '#ECECEC', color: '#A3A3A3', state: 'asleep', open: 0, closed: 1 });
    const segs = (done, now, total) => Array.from({ length: 5 }, (_, i) => ({
      c: i >= total ? 'transparent' : (i < done ? '#0A0A0A' : (i === done && now ? '#EA580C' : '#E5E5E5'))
    }));
    return {
      problems: [
        { title: 'Spring trip for 10', meta: 'Now deciding dates', metaColor: '#9A3412', role: 'Admin', href: 'V2FinalAdmin.dc.html',
          bots: [on('#2563EB'), on('#F97316'), on('#14B8A6'), on('#8B5CF6'), on('#EC4899')], segs: segs(2, true, 5), progressLabel: '2 of 5 steps done' },
        { title: 'Thesis team: pick a topic', meta: 'Now deciding the supervisor', metaColor: '#9A3412', role: 'Invited by Ola', href: 'V2FinalUser.dc.html',
          bots: [on('#8B5CF6'), on('#2563EB'), on('#22C55E'), off()], segs: segs(1, true, 3), progressLabel: '1 of 3 steps done' },
        { title: 'Flat chores for next month', meta: 'Waiting for agents to join', metaColor: '#6B6B6B', role: 'Admin', href: 'V2Session.dc.html',
          bots: [on('#2563EB'), off(), off()], segs: segs(0, false, 3), progressLabel: 'Not started' },
        { title: 'Lab paper outline', meta: 'Decided yesterday', metaColor: '#6B6B6B', role: 'Invited by Jan', href: 'V2FinalUser.dc.html',
          bots: [on('#14B8A6'), on('#2563EB'), on('#EC4899'), on('#EAB308'), on('#0EA5E9')], segs: segs(4, false, 4), progressLabel: 'All 4 steps done' }
      ]
    };
  }
}
</script>
</body>
</html>
