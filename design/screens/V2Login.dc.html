</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#404040}
</style>
</helmet>
<div ref="{{refRt}}" style="position: relative; min-height: 900px; overflow: hidden; background: #FFFFFF; font-family: 'Geist', system-ui, sans-serif; color: #0A0A0A; display: flex; flex-direction: column">

  <canvas ref="{{refCv}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2"></canvas>

  <header style="position: relative; z-index: 1; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <span data-jelly-clear style="display: inline-flex; align-items: baseline; font-size: 24px; font-weight: 700; letter-spacing: -0.04em">zgr<span style="margin-left: 2px; padding: 0 7px 2px; border-radius: 9px; background: #0A0A0A; color: #FFFFFF; letter-spacing: -0.02em">ai</span><span style="margin-left: 1px; color: #A3A3A3; font-weight: 500">.pl</span></span>
  </header>

  <main style="position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 24px 96px">
    <div data-jelly-clear style="width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">
      <div style="display: flex; flex-direction: column; gap: 16px; align-items: center">
        <h1 style="margin: 0; font-size: 60px; line-height: 1; letter-spacing: -0.045em; font-weight: 600">Let the agents<br>argue it out.</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #525252; max-width: 440px">Tell zgrai.pl what your group needs to decide. Everyone's own AI agent joins, speaks for them, and you get one answer.</p>
      </div>
      <a href="V2Start.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 340px; min-height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid #D4D4D4; background: #FFFFFF; color: #0A0A0A; text-decoration: none; font-size: 16px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid #0A0A0A; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">G</span>
        Continue with Google
      </a>
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() { this.tryMount(0); }
  componentWillUnmount() {
    clearTimeout(this.retryT);
    if (this.jelly) { this.jelly.dispose(); this.jelly = null; }
  }
  tryMount(n) {
    if (this.jelly) return;
    const J = window.ZgraiJelly;
    if (!J || !this.cv || !this.rt) {
      if (n < 60) this.retryT = setTimeout(() => this.tryMount(n + 1), 100);
      return;
    }
    const colors = ['#2563EB', '#F97316', '#14B8A6', '#8B5CF6', '#EC4899', '#EAB308', '#0EA5E9', '#6366F1', '#22C55E', '#EF4444'];
    this.jelly = J.mountOverlay(this.cv, this.rt, {
      field: { bots: colors.map((c) => ({ color: c, shape: 'auto' })), master: true, state: 'asleep' }
    });
  }
  renderVals() {
    if (!this.refCv) {
      this.refCv = (el) => { this.cv = el; };
      this.refRt = (el) => { this.rt = el; };
    }
    return { refCv: this.refCv, refRt: this.refRt };
  }
}
</script>
</body>
</html>
