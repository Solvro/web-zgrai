<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zgrai.pl sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A0A}a:hover{color:#404040}
@keyframes doze{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(5px) rotate(-2deg)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(12px,-26px) scale(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="position: relative; min-height: 900px; overflow: hidden; background: #FFFFFF; font-family: 'Geist', system-ui, sans-serif; color: #0A0A0A; display: flex; flex-direction: column">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{agents}}" as="a" hint-placeholder-count="10">
      <div style="position: absolute; left: {{a.left}}; top: {{a.top}}; width: {{a.size}}; animation: {{a.anim}}">
        <svg viewBox="0 0 56 56" width="100%" fill="none" style="display: block">
          <circle cx="28" cy="6" r="3.2" fill="#ECECEC"></circle>
          <rect x="26.6" y="7" width="2.8" height="7" rx="1.4" fill="#ECECEC"></rect>
          <rect x="7" y="13" width="42" height="36" rx="14" fill="#ECECEC"></rect>
          <path d="M16 30q4.5 3.5 9 0M31 30q4.5 3.5 9 0" stroke="#B5B5B5" stroke-width="2.6" stroke-linecap="round"></path>
        </svg>
        <span style="position: absolute; right: -8px; top: -12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 15px; font-weight: 500; color: #A3A3A3; opacity: {{a.z}}; animation: {{a.zAnim}}">z</span>
      </div>
    </sc-for>
  </div>

  <header style="position: relative; z-index: 1; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <span style="display: inline-flex; align-items: baseline; font-size: 24px; font-weight: 700; letter-spacing: -0.04em">zgr<span style="margin-left: 2px; padding: 0 7px 2px; border-radius: 9px; background: #0A0A0A; color: #FFFFFF; letter-spacing: -0.02em">ai</span><span style="margin-left: 1px; color: #A3A3A3; font-weight: 500">.pl</span></span>
  </header>

  <main style="position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 24px 96px">
    <div style="width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">
      <div style="display: flex; flex-direction: column; gap: 16px; align-items: center">
        <h1 style="margin: 0; font-size: 60px; line-height: 1; letter-spacing: -0.045em; font-weight: 600">Let the agents<br>argue it out.</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #525252; max-width: 440px">Tell zgrai.pl what your group needs to decide. Everyone's own AI agent joins, speaks for them, and you get one answer.</p>
      </div>
      <a href="V2Start.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 340px; min-height: 52px; box-sizing: border-box; border-radius: 14px; border: 1px solid #D4D4D4; background: #FFFFFF; color: #0A0A0A; text-decoration: none; font-size: 16px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid #0A0A0A; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">G</span>
        Continue with Google
      </a>
      
    </div>
  </main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { l: '7%', t: '15%', s: '76px' }, { l: '18%', t: '47%', s: '56px' },
      { l: '8%', t: '74%', s: '66px' }, { l: '27%', t: '84%', s: '48px' },
      { l: '29%', t: '9%', s: '46px' }, { l: '66%', t: '8%', s: '54px' },
      { l: '83%', t: '18%', s: '72px' }, { l: '89%', t: '50%', s: '54px' },
      { l: '77%', t: '72%', s: '66px' }, { l: '62%', t: '86%', s: '46px' }
    ];
    return {
      agents: list.map((a, i) => ({
        left: a.l, top: a.t, size: a.s,
        anim: 'doze 5s ease-in-out -' + (i * 0.7) + 's infinite',
        z: i % 3 === 0 ? 1 : 0,
        zAnim: 'zzz 3.4s ease-out -' + (i * 0.5) + 's infinite'
      }))
    };
  }
}
</script>
</body>
</html>
